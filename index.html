<!doctype html>
<html lang="ko">
<title>해기사 기출 CBT</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16365a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 시험지(문제) + 우측 OMR 답안표기란, 모바일에서는 OMR이 하단 서랍으로 */
:root{
  --bg:#eef1f3; --paper:#ffffff; --ink:#15212b; --muted:#5b6a76; --line:#d3dade;
  --navy:#16365a; --navy-soft:#e3eaf2; --omr:#c2410c; --omr-soft:#fdeee4;
  --ok:#15803d; --ok-soft:#e3f4e8; --bad:#b91c1c; --bad-soft:#fbe6e6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --paper:#172129; --ink:#e4e9ec; --muted:#93a2ad; --line:#2b3943;
  --navy:#8fb4dc; --navy-soft:#1f3346; --omr:#f28a52; --omr-soft:#3a2418;
  --ok:#5ccf86; --ok-soft:#173222; --bad:#f07a7a; --bad-soft:#3b1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --paper:#172129; --ink:#e4e9ec; --muted:#93a2ad; --line:#2b3943;
  --navy:#8fb4dc; --navy-soft:#1f3346; --omr:#f28a52; --omr-soft:#3a2418;
  --ok:#5ccf86; --ok-soft:#173222; --bad:#f07a7a; --bad-soft:#3b1c1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--omr);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem;margin:0;color:var(--navy);letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:6px;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn.warn{background:var(--omr);border-color:var(--omr);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px}
.label{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:8px}
/* home */
.home{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.home>*{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.field{margin-bottom:18px}
.startbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.count{color:var(--muted);font-size:.9rem}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.4rem;color:var(--navy)}
.stat span{font-size:.8rem;color:var(--muted)}
.prog{width:100%;border-collapse:separate;border-spacing:4px;margin:4px 0 12px;font-size:.84rem}
.prog th{font-weight:600;color:var(--muted);font-size:.78rem;text-align:center}
.prog th.y{text-align:left;color:var(--ink);font-family:var(--f-mono)}
.pc{border:1px solid var(--line);border-radius:6px;padding:5px 2px;text-align:center;cursor:pointer;background:var(--paper);min-width:52px;line-height:1.25}
.pc b{display:block;font-family:var(--f-mono);font-size:.95rem}
.pc small{color:var(--muted);font-size:.72rem}
.pc.none{color:var(--muted);border-style:dashed}
.pc.ok{background:var(--ok-soft);border-color:var(--ok)} .pc.ok b{color:var(--ok)}
.pc.no{background:var(--bad-soft);border-color:var(--bad)} .pc.no b{color:var(--bad)}
.pc.part{background:var(--omr-soft);border-color:var(--omr)} .pc.part b{color:var(--omr)}
.chip .cb{font-size:.72rem;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:600}
.chip[aria-pressed="true"] .cb{background:rgba(255,255,255,.2);color:inherit}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid}
.bk{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.bk .btn{font-size:.82rem;padding:6px 10px}
.hist{font-size:.88rem;border-collapse:collapse;width:100%}
.hist td{padding:6px 4px;border-top:1px solid var(--line)}
.hist td.n{font-family:var(--f-mono);text-align:right}
.tip{font-size:.85rem;color:var(--muted);margin-top:14px}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:.8rem;background:var(--navy-soft);color:var(--navy);padding:3px 10px;border-radius:4px;font-weight:600}
.timer{font-family:var(--f-mono);font-weight:600;color:var(--navy)}
.timer.low{color:var(--bad)}
.qtext{font-size:1.12rem;font-weight:500;white-space:pre-line;margin:0 0 14px}
.qtext .no{font-family:var(--f-mono);color:var(--omr);margin-right:6px;font-weight:600}
.qimg{margin:6px 0 16px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;display:inline-block;max-width:100%}
.qimg img{display:block;max-height:420px;width:auto;max-width:100%;height:auto;object-fit:contain}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:12px 14px;width:100%}
.opt:hover{border-color:var(--navy)}
.opt .mk{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.opt.sel{border-color:var(--omr);background:var(--omr-soft)}
.opt.sel .mk{background:var(--omr);border-color:var(--omr);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{margin-top:14px;font-weight:600}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.omr{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.omr h3{margin:0 0 4px;font-size:1rem}
.omrsub{font-size:.8rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cell{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:3px 0;font-family:var(--f-mono);font-size:.78rem;line-height:1.2;text-align:center}
.cell i{display:block;font-style:normal;font-family:var(--f-body);font-size:.72rem;color:var(--omr);font-weight:700;min-height:1em}
.cell.done{background:var(--omr-soft);border-color:var(--omr)}
.cell.cur{outline:2px solid var(--navy);outline-offset:1px}
.cell.r{background:var(--ok-soft);border-color:var(--ok)} .cell.r i{color:var(--ok)}
.cell.w{background:var(--bad-soft);border-color:var(--bad)} .cell.w i{color:var(--bad)}
.omrscroll{max-height:55vh;overflow:auto;padding-right:4px}
.omrfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
/* result */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:3rem;font-weight:600;line-height:1}
.pass{font-weight:700;padding:4px 12px;border-radius:4px}
.pass.y{background:var(--ok-soft);color:var(--ok)} .pass.n{background:var(--bad-soft);color:var(--bad)}
.subtbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:.95rem}
.subtbl th,.subtbl td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.subtbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:var(--navy)}
.bar span.low{background:var(--bad)}
.tblwrap{overflow-x:auto}
/* note */
.nitem{border-top:1px solid var(--line);padding:16px 0}
.nitem:first-child{border-top:0}
.nmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.miss{color:var(--bad);font-weight:600}
.nopts{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.nopts li{padding:4px 8px;border-radius:4px}
.nopts li.ans{background:var(--ok-soft);color:var(--ok);font-weight:600}
.nopts li.mine{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.memo{width:100%;min-height:44px;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;resize:vertical}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.small{font-size:.85rem;color:var(--muted)}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.expl{margin-top:18px;border-top:2px solid var(--navy);padding-top:14px}
.exh{font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.exh .ans{background:var(--ok-soft);color:var(--ok);padding:1px 10px;border-radius:4px}
.exw{margin:0 0 12px;white-space:pre-line}
.exo{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
.exo li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;padding:6px 10px;border-radius:6px;background:var(--bg)}
.exo li b{flex:none;width:22px}
.exo li.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.extip{background:var(--omr-soft);border-left:4px solid var(--omr);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.94rem}
.extip b{color:var(--omr)}
.exchk{margin-top:10px;background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:6px;font-size:.9rem;font-weight:600}
.exfig{margin:4px 0 14px;padding:12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--paper)}
.exfig svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.exfig figcaption{font-size:.85rem;color:var(--muted);margin-top:8px;text-align:center}
.fl-soft{fill:var(--navy-soft)} .fl-accsoft{fill:var(--omr-soft)} .fl-acc{fill:var(--omr)}
.st-acc{stroke:var(--omr)} .st-bad{stroke:var(--bad)} .t-acc{fill:var(--omr)} .t-bad{fill:var(--bad)} .t-inv{fill:var(--paper)}
.exbtn{margin-top:14px}
.guessbtn{border:1.5px dashed var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;color:var(--muted)}
.skipbtn{border:1.5px dashed var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;color:var(--bad);margin-left:auto}
.skipbtn[aria-pressed="true"]{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.guessbtn[aria-pressed="true"]{border-style:solid;border-color:#b7791f;background:#fdf3dc;color:#8a5a00}
:root[data-theme="dark"] .guessbtn[aria-pressed="true"]{background:#3a2e12;color:#f2c14e;border-color:#f2c14e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .guessbtn[aria-pressed="true"]{background:#3a2e12;color:#f2c14e;border-color:#f2c14e}}
.guessrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-4px 0 12px}
.cell{position:relative}
.cell.g::after{content:"찍";position:absolute;top:-6px;right:-5px;font-size:.62rem;font-family:var(--f-body);font-weight:700;background:#b7791f;color:#fff;border-radius:6px;padding:0 3px;line-height:1.3}
.gtag{color:#8a5a00;font-weight:600}
.ntabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ntab{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 16px;font-weight:700}
.ntab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.printonly{display:none}
.tagbad{background:var(--bad-soft);color:var(--bad)}
.card{max-width:760px;margin:0 auto}
.cprog{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cbar{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.cbar span{display:block;height:100%;background:var(--ok);transition:width .3s}
.small-btn{padding:5px 12px;font-size:.85rem}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.rbtn{border:2px solid;border-radius:10px;padding:14px 6px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.rbtn b{font-size:1.1rem}
.rbtn small{font-size:.75rem;color:var(--muted)}
.rbtn.again{border-color:var(--bad);color:var(--bad)} .rbtn.again:hover{background:var(--bad-soft)}
.rbtn.hard{border-color:var(--omr);color:var(--omr)} .rbtn.hard:hover{background:var(--omr-soft)}
.rbtn.good{border-color:var(--ok);color:var(--ok)} .rbtn.good:hover{background:var(--ok-soft)}
.cardhome{max-width:760px;margin:0 auto}
.big-btn{padding:12px 20px;font-size:1.02rem}
@media (max-width:860px){
  .home{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .omr{position:static}
  .omrscroll{max-height:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .exo li{background:none;padding:2px 6px} .exo li.ok{border:1px solid #000} .expl{border-top:1px solid #000} .exfig{break-inside:avoid;border:0;padding:4px} .exfig svg{max-width:380px}
  :root{--bg:#fff;--paper:#fff;--ink:#000;--muted:#444;--line:#999;--ok:#000;--ok-soft:#fff;--bad:#555;--bad-soft:#fff;color-scheme:light}
  body{background:#fff;font-size:11pt}
  .noprint,header.top{display:none!important}
  .printonly{display:block}
  .wrap{max-width:none;padding:0}
  .panel{border:0;padding:0}
  .nitem{break-inside:avoid;padding:10px 0}
  .nopts li.ans{border:1.5px solid #000;font-weight:700}
  .nopts li.ans::after{content:"  ← 정답"}
  .nopts li.mine::after{content:"  (내 답)"}
  .qimg img{max-height:240px}
  .memo{border:1px dashed #999;min-height:50px}
}

/* ---- 모바일 화면 맞춤 ---- */
@media (max-width:640px){
  header.top{margin-bottom:10px;gap:6px}
  .brand h1{font-size:1.08rem}
  .brand small{font-size:.72rem}
  #navBtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;width:100%}
  body.onmenu #navBtns{display:none}
  #navBtns .btn{padding:7px 2px;font-size:.76rem;line-height:1.2;white-space:normal;word-break:keep-all;min-height:38px}
  .qtext{font-size:1rem;line-height:1.5;margin:0 0 8px}
  .opts{gap:6px}
  .opt{padding:8px 10px;gap:8px;border-radius:7px}
  .opt .mk{width:24px;height:24px;font-size:.76rem}
  .qimg{display:block;padding:4px;margin:4px 0 8px;text-align:center}
  .qimg img{max-height:22vh;margin:0 auto}
  .qtext,.opt{word-break:keep-all;overflow-wrap:anywhere}
  .opt{font-size:.95rem;line-height:1.4}
  .guessrow{gap:6px;margin:0 0 8px}
  .guessbtn{padding:3px 10px;font-size:.78rem}
  .guessrow .small{display:none}
  .panel{padding:14px}
  .qimg.full img{max-height:62vh;width:100%}
  .omr h3{font-size:.88rem}
  .omrsub{font-size:.68rem;margin:6px 0 2px}
  .grid{grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
  .cell{font-size:.58rem;padding:1px 0;border-radius:3px;line-height:1.1}
  .cell i{font-size:.56rem}
  .cell.g::after{top:-4px;right:-3px;font-size:.5rem;padding:0 2px}
}

.ovl{text-decoration:overline}
.maker{text-align:right;font-size:.72rem;color:var(--muted);opacity:.7;margin-top:28px;letter-spacing:.04em}
/* 첫 화면 */
.menu{max-width:820px;margin:0 auto}
.hero{margin:6px 0 20px}
.hero h2{font-size:1.5rem;line-height:1.35;margin:0 0 6px;color:var(--navy);letter-spacing:-.01em}
.hero p{margin:0;color:var(--muted)}
.gradegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grade{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--gc);border-radius:10px;padding:18px 18px 16px;min-height:178px}
.grade:hover{border-color:var(--gc);box-shadow:0 2px 0 var(--gc)}
.grade .gn{font-size:2.3rem;font-weight:700;line-height:1.1;color:var(--gc)}
.grade .gt{font-weight:600}
.grade .gs{font-size:.84rem;color:var(--muted)}
.grade .gp{margin-top:auto;font-size:.8rem;background:var(--bg);border-radius:6px;padding:4px 9px}
.grade .gx{font-size:.75rem;color:var(--muted)}
.g1{--gc:#b8434f}.g2{--gc:#1c86a8}.g3{--gc:#2a9d84}.g4{--gc:#3d6fb6}.g5{--gc:#e0793f}.g6{--gc:#8a5fc4}.g7{--gc:#1f5fa8}.g8{--gc:#0e8a8a}.g9{--gc:#6a4fb0}.g10{--gc:#b0743a}.g11{--gc:#b0446f}.g12{--gc:#4a8a2e}.g13{--gc:#2b7a9b}.g14{--gc:#7a5a2b}.g15{--gc:#c25a2b}.g16{--gc:#5b8a2b}.g17{--gc:#a03c8c}.g18{--gc:#2b8f6a}.g19{--gc:#6d6d2b}.g20{--gc:#8a3c3c}

<text x="250" y="148" font-size="12" class="t-acc">Vc↑ → ε↓</text>
<text x="250" y="166" font-size="12" class="t-acc">개스킷 두께↑ → ε↓</text>

  window.scrollTo(0,0);
}

function showCat(c){
  const C=CATS[c]; document.body.classList.add('onmenu');
  setHead(TITLE, C.name); document.title=C.name+' · '+TITLE;
  const body = C.gs.length ? `<div class="gradegrid">${C.gs.map(g=>{ const G=GRADES[g]; const gn=G.gn||(g+'급'), gt=G.gt||(g+'급 기관사');
      return `<button class="grade g${g}" data-g="${g}"><span class="gn">${gn}</span><span class="gt">${gt}</span>
        <span class="gs">${G.range}</span><span class="gx">${G.note}</span><span class="gp">${gradeStat(g)}</span></button>`; }).join('')}</div>`
    : `<div class="panel soon"><p>${C.soon}</p></div>`;
  document.getElementById('app').innerHTML=`
  <section class="menu">
    <div class="hero center"><h2>${C.title}<br>CBT 대응 문제풀이</h2>
      <p>${C.gs.length?'공부할 급수를 고르세요. 연도·회차를 골라 실제 시험처럼 풀 수 있습니다.':''}</p></div>
    ${body}
    <button class="btn homebtn" id="goHome">← 처음으로</button>
    ${NOTICE}
  </section>`;
  document.querySelectorAll('.grade').forEach(b=>b.onclick=()=>{ location.href='?g='+b.dataset.g; });
  document.getElementById('goHome').onclick=()=>{ location.href='./'; };
  window.scrollTo(0,0);
}

function showGuide(){

function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.body.appendChild(s); }); }
(function start(){
  const P=new URLSearchParams(location.search);
  const g0=P.get('g');
  document.getElementById('goMenu').onclick=()=>{ location.href=(g0&&GRADES[g0])?('?cat='+catOf(g0)):'./'; };
  if(P.get('page')==='guide') return showGuide();
  if(P.get('cat')&&CATS[P.get('cat')]) return showCat(P.get('cat'));
  const g=P.get('g');
  if(!GRADES[g]) return showMenu();
  const G=window.CBT_G=GRADES[g];
  setHead(G.name+' 기출 CBT', G.sub); document.title=G.name+' 기출 CBT';
  document.getElementById('app').innerHTML='<section class="panel"><p>문제 불러오는 중…</p></section>';
  loadScript('data'+g+'.js?v=6').then(()=>loadScript('app.js?v=6')).catch(()=>{
    document.getElementById('app').innerHTML='<section class="panel"><p>문제를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침 해 주세요.</p><button class="btn" onclick="location.reload()">새로고침</button></section>';
  });
})();
</script>
