name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index_eink.html'
      - 'app.js'
      - 'data*.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK 라이선스 동의
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 앱 뼈대와 파일 준비
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/skei/haegisa android/app/src/main/res/drawable android/app/src/main/assets/www
          cat > android/settings.gradle <<'HAEGISA_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HaegisaCBT"
          include ':app'
          HAEGISA_EOF
          cat > android/build.gradle <<'HAEGISA_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          HAEGISA_EOF
          cat > android/gradle.properties <<'HAEGISA_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          HAEGISA_EOF
          cat > android/app/build.gradle <<'HAEGISA_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.skei.haegisa'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.skei.haegisa'
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  debug {
                      storeFile file('../keystore.jks')
                      storePassword 'android'
                      keyAlias 'haegisa'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          HAEGISA_EOF
          cat > android/app/src/main/AndroidManifest.xml <<'HAEGISA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="해기사 CBT"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          HAEGISA_EOF
          cat > android/app/src/main/java/com/skei/haegisa/MainActivity.java <<'HAEGISA_EOF'
          package com.skei.haegisa;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private static final int REQ_FILE = 1;
              private WebView web;
              private ValueCallback<Uri[]> fileCallback;

              // 페이지가 만든 백업 파일(blob)을 다운로드 폴더에 저장하기 위한 연결
              private static final String PATCH_JS =
                  "(function(){if(window.__patched)return;window.__patched=1;"
                  + "var bm={};var oc=URL.createObjectURL;"
                  + "URL.createObjectURL=function(b){var u=oc.call(URL,b);bm[u]=b;return u;};"
                  + "var oclick=HTMLAnchorElement.prototype.click;"
                  + "HTMLAnchorElement.prototype.click=function(){"
                  + "if(this.download&&bm[this.href]){var n=this.download;var f=new FileReader();"
                  + "f.onload=function(){Android.saveFile(n,String(f.result).split(',')[1]);};"
                  + "f.readAsDataURL(bm[this.href]);return;}"
                  + "return oclick.apply(this,arguments);};})();";

              private class Bridge {
                  @JavascriptInterface
                  public void saveFile(final String name, final String base64) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  ContentValues v = new ContentValues();
                                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                                  v.put(MediaStore.Downloads.MIME_TYPE, "application/json");
                                  v.put(MediaStore.Downloads.RELATIVE_PATH, "Download");
                                  Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                                  OutputStream os = getContentResolver().openOutputStream(uri);
                                  os.write(Base64.decode(base64, Base64.DEFAULT));
                                  os.close();
                                  Toast.makeText(MainActivity.this, "다운로드 폴더에 저장했습니다: " + name, Toast.LENGTH_LONG).show();
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "저장 실패: " + e.getMessage(), Toast.LENGTH_LONG).show();
                              }
                          }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setTextZoom(100);

                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript(PATCH_JS, null);
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "백업 파일 선택"), REQ_FILE);
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("file:///android_asset/www/index.html");
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == REQ_FILE && fileCallback != null) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      }
                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          HAEGISA_EOF
          echo '' | base64 -d > android/keystore.jks
          cp icon-192.png android/app/src/main/res/drawable/ic_launcher.png
          cp index_eink.html android/app/src/main/assets/www/index.html
          cp app.js android/app/src/main/assets/www/
          cp data*.js android/app/src/main/assets/www/
          du -sh android/app/src/main/assets/www

      - name: APK 만들기
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HaegisaCBT.apk && ls -l HaegisaCBT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HaegisaCBT-apk
          path: HaegisaCBT.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 해기사 CBT 앱 (${{ github.run_number }}번째)
          files: HaegisaCBT.apk
